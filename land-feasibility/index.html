<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>土地開發可行性評估</title>
<meta name="description" content="左邊輸入地號等基本資料，右邊算出土地出價上限。全程於瀏覽器內運算，資料不外傳。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%230f766e'/><path d='M22 70 L50 26 L78 70 Z' fill='none' stroke='white' stroke-width='9' stroke-linejoin='round'/></svg>">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>

<header class="topbar">
  <span class="brand">土地開發可行性評估</span>

  <div class="topbar-mid">
    <select id="projectSelect" aria-label="專案"></select>
    <button class="btn btn-ghost" id="btnNewProject">＋</button>
  </div>

  <div class="topbar-right">
    <button class="btn btn-ghost" id="btnReport">報告</button>
    <button class="btn btn-ghost" id="btnMenu">⋯</button>
    <div class="menu" id="menu" hidden>
      <button data-act="export">匯出專案 JSON</button>
      <button data-act="import">匯入專案 JSON</button>
      <button data-act="exportAll">匯出全部專案</button>
      <hr>
      <button data-act="duplicate">複製此專案</button>
      <button data-act="sample">載入示範專案</button>
      <hr>
      <button data-act="unitPing">面積單位：坪</button>
      <button data-act="unitM2">面積單位：平方公尺</button>
      <hr>
      <button data-act="dataMeta">資料版本</button>
      <button data-act="records">覆寫與複核紀錄</button>
      <hr>
      <button data-act="reset" class="danger">刪除此專案</button>
    </div>
    <input type="file" id="fileInput" accept="application/json" hidden>
  </div>
</header>

<div class="wrap">
  <div class="cols">
    <aside class="pane-in" id="paneIn"></aside>
    <main class="pane-out" id="paneOut"></main>
  </div>
</div>

<footer class="footnote">
  初步判斷，不具法律效力。量體與法規檢討須開業建築師簽證，產權須地政士或律師確認。運算全在本機瀏覽器內完成。
</footer>

<div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
<section class="drawer" id="drawer" hidden aria-label="數值明細"></section>

<script src="js/lib/fmt.js"></script>
<script src="js/lib/value.js"></script>
<script src="js/lib/math.js"></script>
<script src="js/lib/store.js"></script>
<script src="js/data/laws.js"></script>
<script src="js/data/districts.js"></script>
<script src="js/data/zoning.js"></script>
<script src="js/data/bonus.js"></script>
<script src="js/data/cost.js"></script>
<script src="js/data/lvr.js"></script>
<script src="js/engine/site.js"></script>
<script src="js/engine/market.js"></script>
<script src="js/engine/m1.js"></script>
<script src="js/engine/m2.js"></script>
<script src="js/engine/m3.js"></script>
<script src="js/engine/m4.js"></script>
<script src="js/engine/m5.js"></script>
<script src="js/engine/m6.js"></script>
<script src="js/engine/m7.js"></script>
<script src="js/engine/m8.js"></script>
<script src="js/engine/pipeline.js"></script>
<script src="js/ui/common.js"></script>
<script src="js/ui/inputs.js"></script>
<script src="js/ui/results.js"></script>
<script src="js/ui/details.js"></script>
<script src="js/ui/report.js"></script>
<script src="js/main.js"></script>
</body>
</html>
